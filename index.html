<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenka Bot Panel</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font-family:Inter,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:22px;font-weight:800}.sub{color:#a1a1aa;font-size:13px;margin-top:4px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#fff;color:#09090b;font-weight:700;cursor:pointer}.btn.dark{background:#18181b;color:#fff;border:1px solid #27272a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat{background:#111113;border:1px solid #242428;border-radius:14px;padding:18px}.stat b{font-size:25px}.stat span{display:block;color:#a1a1aa;font-size:12px;margin-top:6px}.card{background:#111113;border:1px solid #242428;border-radius:16px;padding:20px;margin-bottom:16px}.card h2{margin:0 0 16px;font-size:17px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.input{width:100%;background:#09090b;color:#fff;border:1px solid #303037;border-radius:10px;padding:12px;outline:none}.list{display:grid;gap:10px}.bot{border:1px solid #27272a;border-radius:13px;padding:15px;display:flex;justify-content:space-between;gap:14px;align-items:center}.name{font-weight:750}.meta{font-size:12px;color:#a1a1aa;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.small{padding:8px 10px;font-size:12px}.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;margin-top:8px}.dot{width:7px;height:7px;border-radius:50%;background:#71717a}.online .dot{background:#22c55e}.pair{font-family:monospace;font-size:19px;letter-spacing:4px;margin-top:10px;color:#fff}.empty{text-align:center;color:#71717a;padding:30px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{max-width:420px;width:100%;background:#151517;border:1px solid #2b2b30;border-radius:16px;padding:20px}.modalbox h3{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.bot{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand">TENKA BOT</div><div class="sub">Multi-Bot Control Panel</div></div><button class="btn" onclick="openAdd()">+ Jadikan Bot</button></div>
<div class="grid"><div class="stat"><b id="total">0</b><span>Total Bot</span></div><div class="stat"><b id="online">0</b><span>Online</span></div><div class="stat"><b id="pairing">0</b><span>Pairing</span></div></div>
<section class="card"><h2>Bot Saya</h2><div id="list" class="list"><div class="empty">Belum ada bot.</div></div></section></main>
<div id="modal" class="modal"><div class="modalbox"><h3 id="mtitle">Jadikan Bot</h3><div id="form"><input id="name" class="input" placeholder="Nama bot"><br><br><input id="phone" class="input" placeholder="Nomor WhatsApp, contoh 62812xxxx"><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Batal</button><button class="btn" onclick="createBot()">Buat Bot</button></div></div><div id="pairbox" style="display:none"><div class="sub">Masukkan nomor tersebut ke proses pairing WhatsApp kamu.</div><div id="pair" class="pair">------</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Selesai</button></div></div></div></div>
<script>
const $=x=>document.getElementById(x); let data=[];
async function load(){data=await fetch('/api/sessions').then(r=>r.json()); render()}
function render(){ $('total').textContent=data.length; $('online').textContent=data.filter(x=>x.status==='online').length; $('pairing').textContent=data.filter(x=>x.status==='pairing').length; $('list').innerHTML=data.length?data.map(x=>`<div class="bot"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.phone)}</div><div class="status ${x.status==='online'?'online':''}"><i class="dot"></i>${x.status}</div>${x.pairing?`<div class="pair">${x.pairing}</div>`:''}</div><div class="actions"><button class="btn dark small" onclick="act('${x.id}','pair')">Pair</button><button class="btn dark small" onclick="act('${x.id}','${x.status==='online'?'stop':'start'}')">${x.status==='online'?'Stop':'Start'}</button><button class="btn dark small" onclick="act('${x.id}','restart')">Restart</button><button class="btn dark small" onclick="delBot('${x.id}')">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada bot.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openAdd(){$('modal').classList.add('show');$('form').style.display='block';$('pairbox').style.display='none';$('name').value='';$('phone').value=''} function closeModal(){$('modal').classList.remove('show')}
async function createBot(){const name=$('name').value.trim(),phone=$('phone').value.trim();if(!name||!phone)return alert('Nama dan nomor wajib diisi');const s=await fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone})}).then(r=>r.json());data.push(s);render();const p=await fetch('/api/sessions/'+s.id+'/pair',{method:'POST'}).then(r=>r.json());$('form').style.display='none';$('pairbox').style.display='block';$('pair').textContent=p.pairing}
async function act(id,a){await fetch('/api/sessions/'+id+'/'+a,{method:'POST'});load()} async function delBot(id){if(!confirm('Hapus bot ini?'))return;await fetch('/api/sessions/'+id,{method:'DELETE'});load()}load();setInterval(load,5000);
</script></body></html>
